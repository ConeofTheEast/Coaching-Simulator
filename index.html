<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07051a" />
  <title>Vaultball Coach</title>
  <meta name="description" content="A coaching game for IB SEHS: personality, mental toughness, injury and IB command terms." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-view="title">
  <canvas id="arena"></canvas>
  <div id="vignette"></div>

  <script src="js/main.js"></script>

</html>
